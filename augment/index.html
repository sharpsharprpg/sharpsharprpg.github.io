<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>SharpSharp RPG Augment Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 몹 위키·총기 위키와 같은 야전 교범 톤: 왼쪽 목록 + 오른쪽 기록 카드. 한 가지 어두운 화면으로 고정.
   등급 색(실버·골드·다이아몬드)만 따로 둔다 */
:root{
  color-scheme:dark;
  --ink:#15170f; --panel:#1d2016; --panel-2:#262a1c; --panel-3:#2e321f;
  --line:#3a3f2c; --line-soft:#282c1c;
  --paper:#ece7d6; --paper-dim:#a29c81; --paper-faint:#6f6a53;
  --stamp:#c9622a; --stamp-dim:#7a3f1e; --stamp-glow:rgba(201,98,42,.16);
  --brass:#c7a233; --brass-dim:#8a6f22;
  --r-silver:#c4c7b8; --r-silver-dim:#6c6f63; --r-gold:#e0b43c; --r-gold-dim:#8a6f22; --r-diamond:#5fcac3; --r-diamond-dim:#2f6f6b;
  /* 2026-11-11 위키 공통: 글꼴은 IBM Plex Sans KR 한 가지 (영문·고정폭 글꼴 따로 쓰지 않음) */
  --f-body:'IBM Plex Sans KR','IBM Plex Sans','Noto Sans Egyptian Hieroglyphs','Segoe UI Historic',sans-serif;
  --f-mono:'IBM Plex Sans KR','IBM Plex Sans','Noto Sans Egyptian Hieroglyphs','Segoe UI Historic',sans-serif;
  --f-disp:'IBM Plex Sans KR','IBM Plex Sans','Noto Sans Egyptian Hieroglyphs','Segoe UI Historic',sans-serif;
}
*{box-sizing:border-box;}
html,body{background:var(--ink);}
body{margin:0; color:var(--paper); font-family:var(--f-body); font-size:14px; line-height:1.55;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:70; background:var(--panel);}
::selection{background:var(--stamp); color:var(--ink);}
h1,h2,h3,h4{margin:0; text-wrap:balance;}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
.disp{font-family:var(--f-disp); text-transform:uppercase; letter-spacing:.02em;}
a{color:inherit;}
button{font:inherit;}
:focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}

.app{display:grid; grid-template-columns:340px 1fr; min-height:100vh;}
.side{position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column;}
.side::-webkit-scrollbar{width:8px;} .side::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
.side-toggle{display:none; position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:calc(12px + env(safe-area-inset-left,0px)); z-index:60; width:42px; height:42px; align-items:center; justify-content:center; background:var(--panel-3); border:1px solid var(--line); color:var(--paper); font-size:18px; cursor:pointer;}
.side-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;}
.side-backdrop.show{display:block;}
@media (max-width:1100px){
  .app{grid-template-columns:1fr;}
  .side-toggle{display:flex;}
  .side{position:fixed; top:0; left:0; width:80vw; max-width:330px; height:100vh; z-index:55; transform:translateX(-100%); transition:transform .2s ease; box-shadow:4px 0 26px rgba(0,0,0,.5); padding-left:env(safe-area-inset-left,0px);}
  .side.open{transform:translateX(0);}
  .main{padding-top:72px !important;}
}
@media (prefers-reduced-motion:reduce){ .side, .tier-slide{transition:none !important;} }

.brand{padding:20px 18px 16px; border-bottom:1px solid var(--line); background:repeating-linear-gradient(135deg, transparent 0 8px, rgba(0,0,0,.12) 8px 9px); cursor:pointer;}
.brand .kicker{font-family:var(--f-mono); font-size:10px; letter-spacing:.18em; color:var(--stamp); text-transform:uppercase; margin-bottom:6px;}
.brand h1{font-size:22px; font-weight:700; letter-spacing:.03em; line-height:1.15;}
.hub-link{display:inline-block;margin-top:10px;font-size:12px;color:var(--brass);border:1px solid var(--brass-dim);padding:4px 10px;text-decoration:none;white-space:nowrap}.hub-link:hover{border-color:var(--brass);color:var(--paper)}
.brand .sub{font-family:var(--f-mono); font-size:10.5px; color:var(--paper-faint); margin-top:6px; letter-spacing:.03em;}

.search-wrap{position:relative; padding:14px 18px; border-bottom:1px solid var(--line);}
.search-input{width:100%; background:var(--ink); border:1px solid var(--line); color:var(--paper); font-family:var(--f-body); font-size:13px; padding:9px 12px; outline:none;}
.search-input::placeholder{color:var(--paper-faint);}
.search-input:focus{border-color:var(--stamp);}
.search-results{position:absolute; left:18px; right:18px; top:calc(100% - 4px); z-index:40; background:var(--panel-3); border:1px solid var(--stamp-dim); box-shadow:0 8px 24px rgba(0,0,0,.5); max-height:60vh; overflow-y:auto; display:none;}
.search-results.show{display:block;}
.search-item{display:flex; align-items:center; gap:9px; padding:7px 12px; cursor:pointer; border-bottom:1px solid var(--line-soft);}
.search-item:last-child{border-bottom:none;}
.search-item:hover,.search-item.hi{background:var(--panel-2);}
.search-item .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;}
.search-empty{padding:14px 12px; font-family:var(--f-mono); font-size:11px; color:var(--paper-faint);}

.ico{display:block; flex:0 0 auto; object-fit:contain;}
.ico.px{image-rendering:pixelated;}
.thumb{width:28px; height:28px; flex:0 0 auto; background:var(--ink); border:1px solid var(--line-soft); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.thumb.silver{border-color:var(--r-silver-dim);} .thumb.gold{border-color:var(--r-gold-dim);} .thumb.diamond{border-color:var(--r-diamond-dim);}

.nav-section{padding:12px 0 3px;}
.nav-head{display:flex; align-items:center; gap:8px; padding:7px 17px; cursor:pointer; user-select:none;}
.nav-head:hover{background:var(--panel-2);}
.nav-head .disp{font-size:18px; color:var(--paper-dim); letter-spacing:.08em;}
.nav-head .count{margin-left:auto; font-family:var(--f-mono); font-size:15px; color:var(--paper-faint);}
.nav-head.active .disp{color:var(--stamp);}
.tier-block{border-top:1px solid var(--line-soft);}
.tier-block:first-of-type{border-top:none;}
.tier-summary{display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none; padding:7px 17px; font-family:var(--f-mono); font-size:14.5px; letter-spacing:.06em; color:var(--brass);}
.tier-summary::before{content:"▸"; display:inline-block; transition:transform .18s; color:var(--paper-faint); font-size:11px;}
.tier-block.is-open > .tier-summary::before{transform:rotate(90deg);}
.tier-summary .count{margin-left:auto; color:var(--paper-faint);}
.tier-summary.silver{color:var(--r-silver);} .tier-summary.gold{color:var(--r-gold);} .tier-summary.diamond{color:var(--r-diamond);}
.tier-slide{display:grid; grid-template-rows:0fr; transition:grid-template-rows .22s ease;}
.tier-block.is-open > .tier-slide{grid-template-rows:1fr;}
.tier-slide > div{overflow:hidden; min-height:0;}
.nav-item{display:flex; align-items:center; gap:10px; padding:6px 17px 6px 24px; cursor:pointer; border-left:2px solid transparent; font-size:16px; color:var(--paper-dim);}
.nav-item:hover{background:var(--panel-2); color:var(--paper);}
.nav-item.sel{background:var(--panel-3); border-left-color:var(--stamp); color:var(--paper);}
.nav-item .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item .badge{font-family:var(--f-mono); font-size:10.5px; padding:1px 5px; border:1px solid var(--line); color:var(--paper-faint); flex:0 0 auto;}
.nav-link{display:flex; align-items:center; gap:10px; padding:9px 17px; cursor:pointer; font-family:var(--f-disp); font-size:17px; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-dim); border-top:1px solid var(--line);}
.nav-link:hover{background:var(--panel-2); color:var(--paper);}
.nav-link.sel{color:var(--stamp);}

.main{min-width:0; padding:34px 40px 80px; padding-left:max(40px, env(safe-area-inset-left,0px)); padding-right:max(40px, env(safe-area-inset-right,0px)); max-width:1080px;}
@media (min-width:1500px){ .main{zoom:1.25;} }
@media (max-width:860px){ .main{padding-top:22px; padding-bottom:60px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));} }

.tag{display:inline-flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.06em; padding:3px 7px; border:1px solid var(--line); color:var(--paper-dim);}
.tag.stamp{border-color:var(--stamp-dim); color:var(--stamp); background:var(--stamp-glow);}
.tag.silver{border-color:var(--r-silver-dim); color:var(--r-silver);}
.tag.gold{border-color:var(--r-gold-dim); color:var(--r-gold); background:rgba(224,180,60,.08);}
.tag.diamond{border-color:var(--r-diamond-dim); color:var(--r-diamond); background:rgba(95,202,195,.08);}
.tag.link{cursor:pointer;} .tag.link:hover{border-color:var(--stamp); color:var(--paper);}

/* ---------- landing ---------- */
.landing .kick{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.18em; color:var(--stamp); text-transform:uppercase; margin-bottom:8px;}
.landing .disp.big{font-size:38px; font-weight:700; margin-bottom:10px;}
.landing p{color:var(--paper-dim); font-size:15px; max-width:66ch; margin:0 0 10px;}
.count-row{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-right:none; margin:22px 0 30px; max-width:720px;}
.count-row .cell{flex:1 1 120px; padding:12px 14px; border-right:1px solid var(--line); cursor:pointer; background:none; border-top:none; border-bottom:none; border-left:none; text-align:left; color:inherit;}
.count-row .cell:hover{background:var(--panel);}
.count-row .lbl{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; color:var(--paper-faint); text-transform:uppercase;}
.count-row .val{font-family:var(--f-mono); font-size:22px; font-weight:600; color:var(--brass);}
.count-row .val.silver{color:var(--r-silver);} .count-row .val.gold{color:var(--r-gold);} .count-row .val.diamond{color:var(--r-diamond);}

.steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px;}
.step{border:1px solid var(--line); background:var(--panel); padding:12px 14px; min-width:0;}
.step .sn{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.1em; color:var(--stamp);}
.step .st{font-weight:600; margin:4px 0 4px;}
.step .sb{font-size:13px; color:var(--paper-dim);}
kbd{font-family:var(--f-mono); font-size:11.5px; border:1px solid var(--line); border-bottom-width:2px; padding:0 5px; background:var(--ink); color:var(--paper);}

.odds{display:flex; height:30px; border:1px solid var(--line); margin:4px 0 8px; max-width:720px;}
.odds div{display:flex; align-items:center; padding:0 10px; font-family:var(--f-mono); font-size:11.5px; color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; min-width:0;}
.odds .silver{background:var(--r-silver);} .odds .gold{background:var(--r-gold);} .odds .diamond{background:var(--r-diamond);}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px;}
.card{border:1px solid var(--line); background:var(--panel); padding:11px 12px; display:flex; gap:11px; cursor:pointer; min-width:0; text-align:left; color:inherit; align-items:flex-start;}
.card:hover{border-color:var(--stamp);}
.card.silver{border-top:2px solid var(--r-silver-dim);} .card.gold{border-top:2px solid var(--r-gold);} .card.diamond{border-top:2px solid var(--r-diamond);}
.card .cb{min-width:0; flex:1;}
.card .nm{font-size:13.5px; font-weight:600;}
.card .ds{font-size:11.5px; color:var(--paper-faint); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

.tree{display:flex; flex-direction:column; gap:8px;}
.chain{display:flex; flex-wrap:wrap; align-items:center; gap:8px; border:1px solid var(--line); background:var(--panel); padding:9px 12px;}
.chain .arrow{color:var(--paper-faint); font-family:var(--f-mono);}

/* ---------- augment detail ---------- */
.spec-head{display:flex; gap:22px; padding-bottom:22px; border-bottom:1px solid var(--line); margin-bottom:26px;}
@media (max-width:620px){ .spec-head{flex-direction:column;} }
.spec-plate{width:160px; height:160px; flex:0 0 auto; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; position:relative; max-width:100%;}
.spec-plate::before{content:""; position:absolute; inset:6px; border:1px dashed var(--line-soft); pointer-events:none;}
.spec-plate.silver{border-color:var(--r-silver-dim);} .spec-plate.gold{border-color:var(--r-gold); box-shadow:inset 0 0 28px rgba(224,180,60,.12);} .spec-plate.diamond{border-color:var(--r-diamond); box-shadow:inset 0 0 30px rgba(95,202,195,.14);}
.spec-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; justify-content:center;}
.spec-tags{display:flex; gap:6px; flex-wrap:wrap;}
.spec-info h1{font-size:32px; font-weight:600;}
.spec-info .en{font-family:var(--f-mono); font-size:12px; color:var(--paper-faint); overflow-wrap:anywhere;}
.spec-info .desc{font-size:15.5px; line-height:1.6; max-width:60ch;}

/* 2026-11-11 위키 공통: 칸 수 고정 금지, 최소 너비 아래로 좁아지면 다음 줄로 */
.stat-strip{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); border:1px solid var(--line); border-right:none; border-bottom:none; margin-bottom:30px;}
.stat .lbl, .stat .val{white-space:nowrap;}
.stat{min-width:0; padding:12px 14px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:4px; overflow:hidden;}
.stat .lbl{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; color:var(--paper-faint); text-transform:uppercase;}
.stat .val{font-family:var(--f-mono); font-size:19px; font-weight:600; overflow-wrap:anywhere;}
.stat .val.brass{color:var(--brass);} .stat .val.dim{color:var(--paper-faint);}
.stat .val.silver{color:var(--r-silver);} .stat .val.gold{color:var(--r-gold);} .stat .val.diamond{color:var(--r-diamond);}
.stat .hint{font-family:var(--f-mono); font-size:9.5px; color:var(--paper-faint);}

section.block{margin-bottom:34px;}
.block-h{display:flex; align-items:baseline; gap:10px; margin-bottom:14px;}
.block-h .disp{font-size:14px; letter-spacing:.08em;}
.block-h .rule{flex:1; height:1px; background:var(--line);}
.block-h .n{font-family:var(--f-mono); font-size:10.5px; color:var(--paper-faint);}

.note{border:1px solid var(--line); background:var(--panel); padding:10px 14px; margin-bottom:8px;}
.note .nl{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em; color:var(--brass); margin-bottom:4px;}
.note .nb{font-size:13.5px; line-height:1.65;}
.note.warn{border-left:3px solid var(--stamp);}
.chips{display:flex; flex-wrap:wrap; gap:6px;}

.rule{border:1px solid var(--line); background:var(--panel); margin-bottom:10px;}
.rule-h{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:9px 14px; border-bottom:1px solid var(--line-soft);}
.rule-h .when{font-family:var(--f-disp); font-size:16px; letter-spacing:.04em;}
.rule-b{padding:10px 14px; display:flex; flex-direction:column; gap:8px;}
.rule-b .row{display:grid; grid-template-columns:52px 1fr; gap:10px; font-size:13.5px;}
.rule-b .k{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em; color:var(--paper-faint); padding-top:2px;}
.rule-b ul{margin:0; padding-left:18px;} .rule-b li{margin:2px 0;}

.tbl-wrap{overflow-x:auto; border:1px solid var(--line);}
table.tbl{width:100%; border-collapse:collapse; font-size:13px;}
table.tbl th{font-family:var(--f-mono); font-size:9.5px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--paper-faint); text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); white-space:nowrap;}
table.tbl th.num{text-align:right;}
table.tbl td{padding:8px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl td.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right;}
table.tbl td.hl{color:var(--brass); font-weight:600;}
.small{font-size:11.5px; color:var(--paper-faint);}
.capped{font-family:var(--f-mono); font-size:9.5px; color:var(--stamp); border:1px solid var(--stamp-dim); padding:0 4px; margin-left:6px;}

.filter-row{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; align-items:center;}
.fbtn{font-family:var(--f-mono); font-size:11px; padding:5px 10px; border:1px solid var(--line); background:var(--panel); color:var(--paper-dim); cursor:pointer;}
.fbtn.on{border-color:var(--stamp); color:var(--stamp); background:var(--stamp-glow);}
.filter-row .search-input{max-width:260px; padding:6px 10px;}
.more-btn{margin-top:10px;}
.two-col{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px;}
.two-col > div{min-width:0;}

.foot-note{margin-top:50px; padding-top:16px; border-top:1px solid var(--line); font-family:var(--f-mono); font-size:10.5px; color:var(--paper-faint); overflow-wrap:anywhere;}

.nav-fabs{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:calc(340px - 12px); transform:translateX(-100%); z-index:58; display:flex; gap:6px;}
@media (max-width:1100px){ .nav-fabs{left:calc(62px + env(safe-area-inset-left,0px)); transform:none; top:calc(12px + env(safe-area-inset-top,0px));} }
.fab-btn{width:38px; height:38px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:var(--panel-3); border:1px solid var(--stamp-dim); color:var(--paper); cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.45);}
.fab-btn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round;}
.fab-btn:hover{border-color:var(--stamp); background:var(--panel-2); color:var(--stamp);}
#backFab:not(.show){opacity:.35; pointer-events:none;}
/* 2026-11-15 위키 공통: 모바일(사이드바가 숨는 폭)에서만 홈 옆에 위키 모음(허브) 버튼 */
.fab-btn.hub-fab{display:none; text-decoration:none;}
@media (max-width:1100px){ .fab-btn.hub-fab{display:inline-flex;} }

/* ---------- 수정자 모드 실시간 편집 ---------- */
.ed{white-space:pre-wrap;}
body.editing [data-edit]{outline:1px dashed var(--stamp-dim); outline-offset:3px; cursor:text; min-height:1.3em; display:inline-block; min-width:4ch;}
body.editing div[data-edit], body.editing p[data-edit]{display:block;}
body.editing [data-edit]:focus{outline:2px solid var(--stamp); background:var(--stamp-glow);}
body.editing [data-edit].edited{box-shadow:-4px 0 0 var(--brass);}
[data-edit]:empty::before{content:attr(data-ph); color:var(--paper-faint);}
.edit-bar{position:fixed; z-index:65; right:calc(14px + env(safe-area-inset-right,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:10px; background:var(--panel-3); border:1px solid var(--stamp-dim); padding:6px 6px 6px 12px; box-shadow:0 4px 18px rgba(0,0,0,.5); max-width:calc(100vw - 28px);}
.edit-bar .st{font-family:var(--f-mono); font-size:11px; color:var(--paper-dim); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.edit-bar .st.err{color:#e07b6f;}
.edit-btn{font-family:var(--f-mono); font-size:12px; padding:6px 12px; border:1px solid var(--stamp); background:var(--stamp-glow); color:var(--stamp); cursor:pointer; flex:0 0 auto;}
body.editing .edit-btn{background:var(--stamp); color:var(--ink);}
/* ---------- 수치 수정 칸 (2026-11-11 위키 공통) ---------- */
.edit-box{border:1px solid var(--stamp-dim); background:var(--panel); padding:12px 14px; margin-bottom:30px;}
.edit-box.ro{border-color:var(--line);}
.ed-h{font-family:var(--f-disp); font-size:15px; letter-spacing:.06em; margin-bottom:10px; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline;}
.ed-hint{font-family:var(--f-mono); font-size:10.5px; color:var(--paper-faint); letter-spacing:0;}
.ed-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:8px 14px; margin-bottom:10px;}
.ed-grid label{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--paper-dim); min-width:0;}
.ed-grid label .o{font-family:var(--f-mono); font-size:10.5px; color:var(--paper-faint);}
.ed-grid input, .ed-note input{background:var(--ink); border:1px solid var(--line); color:var(--paper); font-family:var(--f-mono); font-size:13px; padding:6px 8px; width:100%; min-width:0;}
.ed-grid input:focus, .ed-note input:focus{outline:none; border-color:var(--stamp);}
.ed-grid input.chg{border-color:var(--brass); color:var(--brass);}
.ed-note{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--paper-dim); margin-bottom:10px;}
.ed-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.ed-btn{font-family:var(--f-mono); font-size:12px; padding:6px 12px; border:1px solid var(--line); background:var(--panel-2); color:var(--paper); cursor:pointer;}
.ed-btn.pri{border-color:var(--stamp); background:var(--stamp-glow); color:var(--stamp);}
.ed-btn:disabled{opacity:.5; cursor:default;}
.ed-msg{font-family:var(--f-mono); font-size:11px; color:var(--paper-dim);}
.ed-msg.err{color:#e07b6f;}
.ed-foot, .ed-local{font-size:11.5px; color:var(--paper-faint); margin-top:8px;}
.ed-local{color:var(--brass);}
.ed-ro{font-size:13px;} .ed-ro li{margin:2px 0;}
.ed-copy{width:100%; margin-top:8px; background:var(--ink); color:var(--paper); border:1px solid var(--line); font-family:var(--f-mono); font-size:11px;}
.nav-item .badge.ed, .tag.ed{border-color:var(--brass-dim); color:var(--brass);}
#modeToast{position:fixed; z-index:90; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px)); background:var(--panel-3); border:1px solid var(--stamp); color:var(--paper); font-family:var(--f-mono); font-size:13px; padding:8px 16px; opacity:0; pointer-events:none; transition:opacity .15s;}
#modeToast.show{opacity:1;}
/* 2026-11-11 위키 공통 글꼴 통일: 한 글꼴, 숫자 자릿수 맞춤, 한글 라벨에 자간·대문자 변환 없음 */
html body, html body *{font-family:'IBM Plex Sans KR','IBM Plex Sans','Noto Sans Egyptian Hieroglyphs','Segoe UI Historic',sans-serif !important;}
html body *{font-variant-numeric:tabular-nums;}
.disp, .brand .kicker, .landing .kick, .count-row .lbl, .stat .lbl, table.tbl th, .tag, .nav-head .disp, .tier-summary, .block-h .disp, .rule-h .when, .ed-h, .step .sn, .nav-link, .badge{letter-spacing:normal !important; text-transform:none !important;}
[hidden]{display:none !important;}   /* hidden 속성이 .edit-bar 등의 display 에 덮이지 않게 (게시 기본 스타일에 기대지 않음) */
/* 2026-11-16 위키 공통: 모바일(사이드바가 숨는 1100px 이하) 목록 크기 — 펼침 버튼·항목 줄 누르는 높이 44px 이상, 글자 16/15px 이상, 보조 글자 13px 이상 */
@media (max-width:1100px){
  .tier-summary{min-height:44px; font-size:16px; padding-top:8px; padding-bottom:8px;}
  .tier-summary::before{font-size:22px; line-height:1; width:1em; text-align:center;}
  .brand{padding-top:calc(62px + env(safe-area-inset-top,0px));}   /* 사이드바를 열었을 때 위쪽 버튼 줄(메뉴·뒤로·홈·허브)이 제목을 가리지 않게 */
  .nav-head{min-height:44px;}
  .nav-head .count{font-size:15px;}
  .nav-item{min-height:44px; font-size:16px; padding-top:6px; padding-bottom:6px;}
  .nav-item .badge{font-size:13px; padding:2px 6px;}
  .nav-link{min-height:44px;}
  .search-input{font-size:16px; min-height:44px;}
  .search-item{min-height:44px;}
  .search-item .nm{font-size:15px;}
  .search-item .tag{font-size:13px;}
  .search-empty{font-size:13px;}
}

<script>
const D = JSON.parse(document.getElementById('wiki-data').textContent);
const AUGS = D.augs;
const BY = {}; AUGS.forEach(a=>BY[a.id]=a);
const RAR = D.rarity;            // key -> [한글, EN, 카드 확률 가중치]
const RORDER = ['silver','gold','diamond'];
const FAM = {}; D.fam.forEach(f=>FAM[f[0]]={ko:f[1], en:f[2]});
const UNLOCKS = {}; AUGS.forEach(a=>a.pre.forEach(p=>{ (UNLOCKS[p]=UNLOCKS[p]||[]).push(a.id); }));
const RSUM = RORDER.reduce((s,r)=>s+RAR[r][2],0);

// 실시간 편집: 덮어쓰기 값은 db 의 edits/<키> 문서 {text, at}. 칸을 비우면 원래 문구로 돌아감.
let EDITS = {}, EDITING = false, DB = null, IS_OWNER = false, PENDING_RENDER = false;
let NUM = {}, LOCAL = false, LOCAL_WHY = '', CAN_EDIT = false;   // CAN_EDIT = 수정 칸을 보여 줄지(= 수정자 모드). 공유 저장 권한은 IS_EDITOR
let IS_EDITOR = false;   // 확인된 편집자 = canEdit / isOwner 만(can('data.write') 는 interact 수준이라 편집자 판정에 쓰지 않음). 공유 쓰기가 한 번 성공해도 true
let TRY_SHARED = false;  // 편집자인지 모르거나 interact 수준 → 저장 때 공유 쓰기를 한 번 시도, 거부되면 false 로 바꾸고 브라우저에 보관
let NO_DB = false, UPLOADING = false, SW_ERR = '', SW_UNKNOWN = false, EDIT_STATE = 'loading';
// 수정자 모드: 검색 칸에 비밀 코드(해시로만 비교)를 넣으면 켜고/끔. 일반 모드에선 수정 칸·수정 표시·문구 편집 버튼을 아예 숨김.
// 2026-11-14 사용자 지시: 증강 위키는 다른 위키와 별도의 코드(원문은 어디에도 쓰지 않음). 입력은 앞뒤 공백 제거 + 소문자로 바꾼 뒤 비교
// 2026-11-15 사용자 답: 공통 수정자 코드도 받음(전역 CLAUDE.md 해시). 증강 위키 전용 코드(11-14)도 계속 받음
const EDIT_CODE_SHAS = ['aa895dfd415d13f697aa7b499fdb956c8f931fbd2ad94cf9da8e13cc8cf419d1', 'dafe102170e9c727d0274ac92beae8c69dec0b4b926e6985f0d05c8829b55561'];
const MODE_KEY = 'sharpsharp_augment_wiki_editmode';
let EDIT_MODE = false;
try { EDIT_MODE = localStorage.getItem(MODE_KEY) === '1'; } catch (e) {}
let DB_DOCS = {};   // 공유 저장소에서 읽은 문서 (브라우저 저장분은 그 위에 덮어 보여 줌)   // NUM = 수치 수정 문서 edits/<증강 id> {kind:'stats', vals, orig, note}
function T(key, orig){ const v = EDITS[key]; return (typeof v === 'string' && v !== '') ? v : orig; }
function rich(s){ return esc(s).replace(/\[([A-Za-z0-9]{1,3})\]/g, '<kbd>$1</kbd>'); }   // [U] → 키 모양
function ed(key, orig, tag, cls, ph){
  tag = tag || 'span'; const v = T(key, orig); const edited = Object.prototype.hasOwnProperty.call(EDITS, key);
  return `<${tag} class="ed${cls?' '+cls:''}${edited?' edited':''}" data-edit="${esc(key)}" data-orig="${esc(orig)}"${ph?` data-ph="${esc(ph)}"`:''}${EDITING?' contenteditable="plaintext-only" spellcheck="false"':''}>${EDITING?esc(v):rich(v)}</${tag}>`;
}
function nm(a){ return T('aug.'+a.id+'.name', a.name); }
function ds(a){ return T('aug.'+a.id+'.desc', a.desc); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ if(n==null||n==='') return '—'; const v=Number(n); if(!isFinite(v)) return String(n); return (Math.round(v*100)/100).toLocaleString('ko-KR'); }
function byName(a,b){ return nm(a).localeCompare(nm(b),'ko'); }
function icon(a, px){ const i=D.icons[a.icon]; return `<img class="ico${i.px?' px':''}" src="${i.src}" width="${px}" height="${px}" alt="">`; }
function thumb(a){ return `<div class="thumb ${a.rarity}">${icon(a,22)}</div>`; }
function rtag(r){ return `<span class="tag ${r}">${esc(RAR[r][0])}</span>`; }
function hashOf(id){ return 'aug-'+id.replace(/_/g,'-'); }
function idOfHash(h){ return h.startsWith('aug-') ? h.slice(4).replace(/-/g,'_') : null; }
function augLink(id){ const a=BY[id]; return a?`<span class="tag link ${a.rarity}" data-go="${hashOf(id)}">${esc(nm(a))}</span>`:''; }

// ---------- 왼쪽 목록 ----------
const side = document.getElementById('side');
function navItem(a, badge){ return `<div class="nav-item" data-id="${esc(a.id)}">${thumb(a)}<span class="nm">${esc(nm(a))}</span>${EDIT_MODE && NUM[a.id]?'<span class="badge ed">수정</span>':''}${badge?`<span class="badge">${esc(badge)}</span>`:''}</div>`; }
function block(cls, title, list, badgeFn){
  return `<div class="tier-block"><div class="tier-summary ${cls}">${esc(title)}<span class="count">${list.length}</span></div><div class="tier-slide"><div>${list.sort(byName).map(a=>navItem(a,badgeFn(a))).join('')}</div></div></div>`;
}
function renderSide(){
  let h = `<div class="brand" data-go=""><div class="kicker">SharpSharp RPG · Augments</div><h1 class="disp">Augment Wiki</h1><div class="sub">증강 ${AUGS.length}종 · U 키로 고르는 3장 카드</div><a class="hub-link" href="https://sharpsharprpg.github.io/hub/" target="_blank" rel="noopener">위키 모음으로 가기 ↗</a></div>`;
  h += `<div class="search-wrap"><input class="search-input" id="q" type="search" placeholder="증강 이름이나 효과로 찾기" autocomplete="off" aria-label="증강 검색"><div class="search-results" id="qr"></div></div>`;
  h += `<div class="nav-section"><div class="nav-head"><span class="disp">등급별</span><span class="count">${AUGS.length}</span></div>`;
  RORDER.forEach(r=>{ h += block(r, `${RAR[r][0]} ${RAR[r][1]}`, AUGS.filter(a=>a.rarity===r), a=>FAM[a.fam].ko); });
  h += `</div><div class="nav-section"><div class="nav-head"><span class="disp">계열별</span><span class="count">${D.fam.length}</span></div>`;
  D.fam.forEach(f=>{ h += block('', `${f[1]} ${f[2]}`, AUGS.filter(a=>a.fam===f[0]), a=>RAR[a.rarity][0]); });
  h += `</div>`;   // 2026-11-23 사용자: '선택권 얻는 법' 설명 화면은 필요 없음
  side.innerHTML = h;
  side.querySelectorAll('.tier-summary').forEach(s=>s.addEventListener('click',()=>s.parentElement.classList.toggle('is-open')));
  side.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>go(hashOf(n.dataset.id))));
  setupSearch();
}
function setupSearch(){
  const q=document.getElementById('q'), qr=document.getElementById('qr'); let hi=-1, res=[];
  function draw(){
    const s=q.value.trim().toLowerCase();
    if(!s){ qr.classList.remove('show'); return; }
    res = AUGS.filter(a=>(nm(a)+' '+ds(a)+' '+a.attrs.map(x=>x.name).join(' ')).toLowerCase().includes(s)).sort(byName);
    qr.innerHTML = res.length ? res.map((a,i)=>`<div class="search-item${i===hi?' hi':''}" data-id="${esc(a.id)}">${thumb(a)}<span class="nm">${esc(nm(a))}</span>${rtag(a.rarity)}</div>`).join('') : `<div class="search-empty">"${esc(q.value)}" 에 맞는 증강이 없습니다.</div>`;
    qr.classList.add('show');
    qr.querySelectorAll('.search-item').forEach(n=>n.addEventListener('mousedown',e=>{ e.preventDefault(); pick(n.dataset.id); }));
  }
  function pick(id){ q.value=''; qr.classList.remove('show'); go(hashOf(id)); }
  q.addEventListener('input',()=>{ hi=-1; draw(); });
  q.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ hi=Math.min(res.length-1,hi+1); draw(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hi=Math.max(0,hi-1); draw(); e.preventDefault(); }
    else if(e.key==='Enter' && res.length){ pick(res[Math.max(0,hi)].id); }
    else if(e.key==='Escape'){ q.value=''; qr.classList.remove('show'); }
  });
  q.addEventListener('blur',()=>setTimeout(()=>qr.classList.remove('show'),120));
}

// ---------- 저장소 (2026-11-11 위키 공통) ----------
// 1순위: 공유 저장소 db 의 edits/ (규칙: edits read view / write admin — 2026-11-15 사용자 직접 승인 "넓혀 줘"). 문구 = edits/<키> {text}, 수치 = edits/<증강 id> {kind:'stats', ...}
// 2순위(공유 저장소에 연결 못 할 때, 예: 로컬 미리보기): 이 브라우저에만 저장 + "수정 내용 복사" 로 채팅에 붙여 넣기.
const LS_KEY = 'sharpsharp_augment_wiki_edits_v1';
function lsLoad(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : {}; }catch(e){ return {}; } }
function lsSave(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
function applyDocs(docs){   // docs = {id: body}
  const m = {}, n = {};
  Object.keys(docs).forEach(id=>{ const b = docs[id]; if(!b) return;
    if(b.kind === 'stats') n[id] = b; else if(typeof b.text === 'string') m[id] = b.text; });
  EDITS = m; NUM = n;
}
// 같은 항목에 이 브라우저 수정과 공유 수정이 함께 있으면 저장 시각(at)이 더 새로운 쪽. 한쪽뿐이면 그쪽(브라우저 사본이 더 새로우면 절대 숨기지 않음).
// 이 위키가 쓰는 저장 시각은 toISOString() 형식뿐. 그 형식이 아니면(없음·'1'·'garbage 5'·숫자 등) 시각을 모르는 것으로 봄
// (2026-11-16: Date.parse 는 '1'·'garbage 5' 도 날짜로 읽어 "시각 모르면 덮지 않음"을 빠져나갔음 — 총기 위키 v300 리뷰)
function atMs(v){ return (typeof v === 'string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/.test(v)) ? Date.parse(v) : NaN; }
function mergedEd(l, sh){
  if(!l) return sh || null;
  if(!sh) return l;
  const tl = atMs(l.at), ts = atMs(sh.at);
  if(isFinite(tl)) return (!isFinite(ts) || tl > ts) ? l : sh;
  return l;   // 브라우저 사본 시각을 모르면 어느 쪽이 새로운지 알 수 없으므로 브라우저 사본을 숨기지 않음(2026-11-16 리뷰)
}
// 공유 삭제는 성공했는데 이 브라우저 사본을 못 지운 항목 {id: 그 사본의 at}. 그 사본은 화면·올리기에서 빼서 지운 수정이 되살아나지 않게 함
// (2026-11-16 누이구루미 v22 리뷰). 브라우저 저장소가 막혀 있으니 메모리 + sessionStorage(되면)에 기억하고, 저장소가 풀리면 다시 지움.
const STUCK_KEY = LS_KEY + '_stuckdel';
const STUCK_DEL = (()=>{ try{ return JSON.parse(sessionStorage.getItem(STUCK_KEY) || '{}') || {}; }catch(e){ return {}; } })();
function stuckSave(){ try{ sessionStorage.setItem(STUCK_KEY, JSON.stringify(STUCK_DEL)); }catch(e){} }
function stuckRetry(){
  const ids = Object.keys(STUCK_DEL); if(!ids.length) return;
  const o = lsLoad(); let ch = false;
  ids.forEach(id=>{ if(!(id in o) || atKey(o[id]) !== STUCK_DEL[id]){ delete STUCK_DEL[id]; ch = true; } });   // 이미 없거나 새로 저장됨 → 기억 해제
  const left = Object.keys(STUCK_DEL);
  if(left.length){ const o2 = lsLoad(); left.forEach(id=>delete o2[id]); if(lsSave(o2)){ left.forEach(id=>delete STUCK_DEL[id]); ch = true; } }
  if(ch) stuckSave();
}
const NOAT = '__noat__';   // 시각 없는 옛 사본도 기억할 수 있게
const atKey = d => (d && typeof d.at === 'string') ? d.at : NOAT;

    .then(r=>{ status(resultText(r, want === null), r === 'fallback' || r === 'error-local' || r === 'refused-nolocal' || r === 'unknown'); if(want === null && (r === 'error-local' || r === 'refused-nolocal' || r === 'unknown')) softRender(); })   // 되돌리기 오류: 화면을 실제 저장된 문구로
    .catch(err=>{
      if(err && (err.partial || err.unknown)){ status(err.message, true); return; }
      status((want === null ? '되돌리지 못함: ' : '저장 안 됨: ') + ((err && err.code === 'invalid_argument') ? '저장 권한이 없습니다(위키 편집 권한 필요)' : ((err && (err.message || err.code)) || err)), true);
      if(want === null) softRender();   // 되돌리기 실패: 화면을 실제 저장된 문구로 돌려놓음(입력 중이면 끝난 뒤)
    });
});
function goLocal(why){
  LOCAL = true; LOCAL_WHY = why; EDIT_STATE = 'local'; TRY_SHARED = false;
  refreshDocs();
  CAN_EDIT = EDIT_MODE; editBar.hidden = !EDIT_MODE;
  if(EDIT_MODE) showIdleStatus();
  softRender();   // 저장소 실패로 바뀌어도 입력 중이던 값은 지킴
}
// 검색 칸: 비밀 코드(해시 일치)면 모드 전환 — 검색 칸 비우고 결과창 닫음
(function(){
  const q = document.getElementById('q'); if(!q) return;
  let seq = 0;
  q.addEventListener('input', async ()=>{
    const v = q.value.trim().toLowerCase(); if(v.length < 2 || v.length > 64) return;
    const my = ++seq; const h = await sha256hex(v);
    if(my !== seq || EDIT_CODE_SHAS.indexOf(h) < 0) return;
    q.value = ''; const qr = document.getElementById('qr'); if(qr) qr.classList.remove('show');
    q.blur(); setEditMode(!EDIT_MODE);
  });
})();
(async ()=>{
  if(!window.claude || !window.claude.use){ goLocal('claude.ai 뷰어 밖에서 열림'); return; }
  let db = null, user = null;
  try{ [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){}
  IS_OWNER = user ? !!(await user.isOwner().catch(()=>false)) : false;
  let ce = false, dw = null;
  if(user){ try{ ce = !!(await user.canEdit()); }catch(e){} try{ dw = await user.can('data.write'); }catch(e){} }
  IS_EDITOR = IS_OWNER || ce;   // 확인된 편집자만(canEdit/isOwner). can('data.write') 는 interact 수준이라 판정에 쓰지 않음
  TRY_SHARED = !IS_EDITOR && dw !== false;   // 모름(null) 또는 interact 수준(true) → 저장 때 한 번 시도, 거부되면 브라우저 저장
  if(!db){ NO_DB = true; goLocal('저장소 기능 없음'); return; }   // db 가 null: 로그인 안 됨이거나 이 보기에서 저장소가 안 열림
  DB = db; CAN_EDIT = EDIT_MODE; editBar.hidden = !EDIT_MODE;
  let first = true;
  const timer = setTimeout(()=>{ if(first){ EDIT_STATE = 'slow'; if(EDIT_MODE && !EDITING) showIdleStatus(); softRender(); } }, 10000);
  try{
    db.collection('edits').onSnapshot(snap=>{
      const docs = {}; Object.keys(SH_DEL).forEach(k=>delete SH_DEL[k]);
      snap.docs.forEach(d=>{ const v = d.data(); if(!v) return; if(v.deleted){ SH_DEL[d.id] = v; addHist(d.id, v); } else { docs[d.id] = v; if(Array.isArray(v.del_prev)) addHist(d.id, {del_prev: v.del_prev}); } });   // deleted:true = 공유 삭제 기록
      if(!(snap.metadata && snap.metadata.hasPendingWrites)){ const L0 = lsLoad(); Object.keys(L0).forEach(k=>{ if(SW_PEND[k] || UPLOADING) return; const r = SH_DEL[k], l = L0[k];   // 확정된 기록만, 쓰기 진행 중인 항목은 건너뜀
          // 다른 탭에 남은 '지운 그 사본'(at 정확 일치: 이력 DEL_HIST 또는 현재 새 형식 기록)만 정리. 옛 형식 시각 비교·STUCK_DEL 로는 지우지 않음
          if(!l || typeof l.at !== 'string') return;
          const hit = (DEL_HIST[k] && DEL_HIST[k].indexOf(l.at) >= 0) || (r && (('id' in r) || ('del_at0' in r) || ('del_shared_at' in r) || ('del_prev' in r)) && (l.at === r.del_at0 || l.at === r.del_shared_at || (Array.isArray(r.del_prev) && r.del_prev.indexOf(l.at) >= 0)));
          if(hit) lsDropIf(k, l.at); }); }
      Object.keys(LAST_SH).forEach(k=>{ if(!SW_PEND[k]) delete LAST_SH[k]; });   // 진행 중 쓰기가 없으면 확정 공유 값이 기준
      DB_DOCS = docs; refreshDocs();
      if(!snap.metadata.fromCache){ clearTimeout(timer); first = false; EDIT_STATE = 'ready'; if(EDIT_MODE && !EDITING) showIdleStatus(); }
      softRender();
    }, err=>{ clearTimeout(timer); goLocal('저장소 읽기 실패' + (err && err.code ? ': ' + err.code : '')); });
  }catch(e){ clearTimeout(timer); goLocal('저장소 연결 실패'); }
})();
</script>
